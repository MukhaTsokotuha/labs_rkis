<div class="block_change_name">
    <div class="content__title">
        <i class="fa-solid fa-circle-arrow-left fa-lg i_back"> </i>
        <h4>Мои файлы</h4>
    </div>

    <div class="content_h3">
        
        <h3>Файл</h3>
    </div>
    <hr>
    <div class="block--block_change">
        <div class="block_change">
            <div class="rule_access">
                <p>Права доступа к файлу: </p>
                <table class="rule_table">
                    <thead>
                        <th>№</th>
                        <th>Email</th>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="rule_change">
                <p>Имя выбранного файла: <span class="file_name"></span></p>
                <p>Идентификатор: <span class="file_id"></span></p>
                <label for="">
                    <p>Изменить права для пользователя: </p>
                    <input class="inp inp_ch" type="email" name="email_access" id="" placeholder="Введите email пользователя">
                </label>
                
                <button class="btn btn--addAc">Добавить</button>
                <button class="btn btn--delAc">Удалить</button>
 
                <div class="message--block"></div>  
            </div>       
        </div>
    </div>
</div>
